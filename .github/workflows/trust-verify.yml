# Trust Verify — dogfoods the Flow Agents external trust anchor on this repo.
#
# On every PR, re-runs this repo's canonical verification FRESH in a clean CI
# environment an agent does not control (build + tests + lint — whatever this
# repo declares as its comprehensive verify). If a Flow Agents session has
# published delivery/trust.bundle, it also RECONCILES the agent's claimed passes
# against CI's own fresh results and fails on any divergence. Missing or stale
# delivery evidence also fails with a diagnostic unless a governed DECLARED
# exemption applies; the check remains non-required during this advisory phase.
#
# ADVISORY PHASE: Trust Verify remains non-required in branch protection, so a
# reconciliation failure stays visible and truthful without blocking merge. A
# separate trusted workflow_run publisher owns PR comments. To arm it, add
# "Trust Verify" as a required, no-bypass status check and protect this file
# plus package.json in CODEOWNERS. See
# https://github.com/kontourai/flow-agents/blob/main/docs/trust-anchor-adoption.md
# for the full adoption guide.
name: Trust Verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  trust-verify:
    name: Trust Verify
    outputs:
      failure-summary: ${{ steps.trust-verify.outputs.failure-summary }}
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: the reconciler binds delivery bundles to commits via
      # `git merge-base --is-ancestor`, which cannot walk a shallow clone —
      # with the default depth-1 checkout every committed bundle looks stale
      # in CI (sealed commit never equals the synthetic merge SHA).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      # The external anchor: re-run our real verify fresh + reconcile any delivered bundle.
      # SHA-pinned (mutable tags are not trusted for a cross-repo action that gates merges).
      - id: trust-verify
        uses: kontourai/flow-agents/.github/actions/trust-verify@90b260996e1c4477c56317935f0362d48a8cf8d5 # flow-agents @ publishes structured failure summary (#1120)
        with:
          # Keep `npm test` as a temporary second manifest lane so the in-flight
          # #147 Builder bundle (recorded before `test:ci` existed) reconciles.
          verify-command: "npm run test:ci,npm test"
  trust-advisory-comment:
    if: >-
      ${{ always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    needs: trust-verify
    permissions:
      pull-requests: write
    uses: kontourai/.github/.github/workflows/trust-advisory-comment.yml@e6dfe1bea874266a98059c682c21a6b73ae9c71e
    with:
      check-name: Trust Verify
      details: ${{ needs['trust-verify'].outputs.failure-summary }}
      pr-number: ${{ github.event.pull_request.number }}
      result: ${{ needs['trust-verify'].result }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
